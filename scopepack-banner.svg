<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-labelledby="title desc">
  <title id="title">ScopePack research project</title>
  <desc id="desc">Preserve the conditions. Pack the evidence. Dependency-closed context compression for Web question answering. Research draft; offline prototype; results pending.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#102440"/><stop offset="1" stop-color="#102e3c"/></linearGradient>
    <linearGradient id="accent"><stop stop-color="#7de6c3"/><stop offset="1" stop-color="#84baff"/></linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#c7e6ff" opacity=".08"/></pattern>
  </defs>
  <rect width="1280" height="360" rx="22" fill="url(#bg)"/>
  <rect width="1280" height="360" rx="22" fill="url(#dots)"/>
  <rect x="50" y="47" width="44" height="5" rx="2.5" fill="url(#accent)"/>
  <text x="110" y="56" fill="#a8c5dd" font-family="Arial, Helvetica, sans-serif" font-size="13" letter-spacing="3">WEB QA / CONTEXT COMPRESSION</text>
  <text x="48" y="137" fill="#f4faff" font-family="Arial, Helvetica, sans-serif" font-size="68" font-weight="700" letter-spacing="-2">ScopePack</text>
  <text x="51" y="183" fill="#bcefdc" font-family="Arial, Helvetica, sans-serif" font-size="24">Preserve the conditions. Pack the evidence.</text>
  <text x="51" y="221" fill="#a8c5dd" font-family="Arial, Helvetica, sans-serif" font-size="16">Dependency-closed compression for grounded Web answers</text>
  <g font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" letter-spacing="1">
    <rect x="51" y="268" width="143" height="32" rx="16" fill="#25445e"/><text x="70" y="289" fill="#d8e9f7">RESEARCH DRAFT</text>
    <rect x="205" y="268" width="175" height="32" rx="16" fill="#194d4a"/><text x="225" y="289" fill="#a9edd4">OFFLINE PROTOTYPE</text>
    <rect x="391" y="268" width="160" height="32" rx="16" fill="#514933"/><text x="408" y="289" fill="#f3d991">RESULTS PENDING</text>
  </g>
  <rect x="731" y="48" width="495" height="264" rx="18" fill="#0c2035" stroke="#35516a"/>
  <text x="758" y="81" fill="#a8c5dd" font-family="Arial, Helvetica, sans-serif" font-size="12" letter-spacing="2">ONE CLAIM. ITS NECESSARY CONTEXT.</text>
  <path d="M791 126V262M791 194H817M791 254H817" fill="none" stroke="#73d9bc" stroke-width="2"/>
  <circle cx="791" cy="126" r="5" fill="#73d9bc"/>
  <rect x="816" y="102" width="381" height="47" rx="8" fill="#214365"/>
  <text x="835" y="131" fill="#eef7ff" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700">Claim / answer-bearing statement</text>
  <rect x="816" y="169" width="381" height="47" rx="8" fill="#17483f"/>
  <text x="835" y="198" fill="#c9f7e8" font-family="Arial, Helvetica, sans-serif" font-size="16">Scope / time, eligibility, exceptions</text>
  <rect x="816" y="235" width="381" height="47" rx="8" fill="#223747"/>
  <text x="835" y="264" fill="#d9e9f5" font-family="Arial, Helvetica, sans-serif" font-size="16">Evidence / antecedents and sources</text>
</svg>
